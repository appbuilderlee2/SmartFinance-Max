name: Build iOS IPA (unsigned)
on:
  workflow_dispatch:
  pull_request:
    paths: &ios-paths
      - 'ios/**'
      - 'capacitor.config.json'
      - '.github/workflows/ios-ipa.yml'
      - 'package.json'
      - 'package-lock.json'
      - '*.ts'
      - '*.tsx'
      - '*.html'
      - '*.css'
      - 'pages/**'
      - 'components/**'
      - 'contexts/**'
      - 'services/**'
      - 'utils/**'
      - 'data/**'
      - 'public/**'
  push:
    branches: [main]
    paths: *ios-paths
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build web app
        run: |
          npm ci
          npm run build
      - name: Sync web bundle and Capacitor plugins
        run: npx cap sync ios
      - name: Test on an iPhone simulator
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | node -e '
            const devices = JSON.parse(require("node:fs").readFileSync(0, "utf8")).devices;
            const phone = Object.entries(devices).filter(([runtime]) => runtime.includes(".iOS-"))
              .reverse().flatMap(([, entries]) => entries).find(entry => entry.name.startsWith("iPhone"));
            if (!phone) process.exit(1);
            console.log(phone.udid);
          ')
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry SmartFinance-Max-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SmartFinance-Max-unsigned-IPA
          path: SmartFinance-Max-unsigned.ipa
          retention-days: 30
