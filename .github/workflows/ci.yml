name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartfinance-ui
          path: ${{ runner.temp }}/smartfinance-ui
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
